services:
  app:
    # Server hanya PULL image ini dari GHCR (tidak build sendiri).
    image: ghcr.io/syukurputra/bantusewa:production
    # `build:` hanya dipakai kalau kamu jalankan `docker compose build` manual.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bantusewa
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "80:3000"   # akses via http://IP (port 80), container tetap listen :3000
    # Postgres sudah ada di luar (Nevacloud managed / server lain),
    # koneksinya lewat DATABASE_URL & DIRECT_URL di .env.production.
