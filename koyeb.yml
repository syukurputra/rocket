# Koyeb Configuration
# This file is used by Koyeb to configure deployment

# Build configuration
build:
  type: buildpack
  buildpack: heroku/nodejs

# Run configuration
run:
  command: npm start

# Environment detection
# Koyeb will use branch name to determine environment
# development branch -> development environment
# main/master/production branch -> production environment

# Health check
health_check:
  path: /api/health
  port: 3000
  initial_delay: 30
  timeout: 5

# Scaling
scaling:
  min: 1
  max: 3

# Regions
regions:
  - sin # Singapore (closest to your database)
