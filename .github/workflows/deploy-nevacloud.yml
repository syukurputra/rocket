name: Build & Deploy to Nevacloud

on:
  push:
    branches: [production]
  workflow_dispatch: {}   # bisa dijalankan manual dari tab Actions

concurrency:
  group: deploy-nevacloud
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/syukurputra/bantusewa

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Wajib: secret SSH_* / GHCR_PAT / PROD_* disimpan sebagai Environment secrets
    # di environment "production", jadi job harus mendeklarasikannya di sini.
    environment: production
    permissions:
      contents: read
      packages: write        # untuk push image ke GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build di runner GitHub (RAM besar → tidak OOM), lalu push ke GHCR.
      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:production
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DATABASE_URL=${{ secrets.PROD_DATABASE_URL }}
            DIRECT_URL=${{ secrets.PROD_DIRECT_URL }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.PROD_SITE_URL }}

      # SSH ke server Nevacloud → pull image baru → restart container.
      - name: Deploy ke server (SSH)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd ~/rocket
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d
            docker image prune -f
            docker compose ps
