name: Deploy Development

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Copy development environment
        # Non-fatal: .env.development tidak di-commit (secret). Env build diambil
        # dari `env:` block di step Build. Jangan bikin workflow gagal di sini.
        run: cp .env.development .env || echo "no .env.development in repo, skipping"

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run linter
        run: npm run lint || true

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DEV_DIRECT_URL }}
          JWT_SECRET: ${{ secrets.DEV_JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.DEV_JWT_REFRESH_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.DEV_SITE_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.DEV_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.DEV_GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.DEV_GOOGLE_REDIRECT_URI }}
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

      - name: Deploy to Koyeb (Development)
        if: github.event_name == 'push'
        run: |
          echo "Deploying to Koyeb development environment"
          # Koyeb will auto-deploy from this branch
